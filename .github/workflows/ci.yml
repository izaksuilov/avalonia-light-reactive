name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LightReactive.Avalonia.slnx
      - run: dotnet build LightReactive.Avalonia.slnx --configuration Release --no-restore
      - run: dotnet test LightReactive.Avalonia.slnx --configuration Release --no-build
      - run: dotnet pack src/LightReactive.Avalonia/LightReactive.Avalonia.csproj --configuration Release --output artifacts/nupkg -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/
